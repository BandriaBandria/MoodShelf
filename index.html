<title>MoodShelf</title>
<style>:root{--bg:#f3eee3;--card:#fbf8f1;--tx:#1a1714;--mu:#6d6559;--ac:#c8321e;--bd:#cfc6b3;--serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--card:#1d1a16;--tx:#efe9dc;--mu:#a89f8e;--ac:#e8553a;--bd:#3a352d}}
:root[data-theme="dark"]{--bg:#14120f;--card:#1d1a16;--tx:#efe9dc;--mu:#a89f8e;--ac:#e8553a;--bd:#3a352d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 var(--serif)}
h1,h2,h3{font-weight:600;letter-spacing:-.02em;line-height:1.08}h1{font-size:clamp(30px,5vw,46px);margin:.2em 0}h2{font-size:25px;margin:44px 0 12px;padding-top:12px;border-top:2px solid var(--tx)}h3{font-size:19px}
button,.tag,.meta,.pl,.note{font-family:var(--mono)}
header{display:flex;justify-content:space-between;align-items:baseline;padding:12px 24px;border-bottom:3px double var(--tx);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.logo{font:700 23px var(--serif);letter-spacing:-.02em;cursor:pointer}.logo span{font-style:italic;font-weight:400}
main{max-width:1040px;margin:0 auto;padding:24px 24px 70px}
button{border:1.5px solid var(--tx);background:transparent;color:var(--tx);padding:9px 16px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:0}
button:hover{background:var(--tx);color:var(--bg)}button.p{background:var(--tx);color:var(--bg)}button.p:hover{background:var(--ac);border-color:var(--ac)}button:disabled{opacity:.35;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 24px}.chip.on{background:var(--tx);color:var(--bg)}
.bar{height:3px;background:var(--bd);margin-bottom:18px}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:28px 20px}
.book{cursor:pointer}.book:hover .cv{transform:translateY(-5px)}
.cv{position:relative;aspect-ratio:2/3;background:#222 center/cover;border-radius:2px 5px 5px 2px;overflow:hidden;color:#f6f0e2;box-shadow:inset 3px 0 0 rgba(255,255,255,.16),3px 7px 14px rgba(0,0,0,.28);transition:.2s}
.cv .art{position:absolute;inset:0 0 34% 0}.cv .art svg{width:100%;height:100%;display:block}
.cv .ti{position:absolute;left:0;right:0;bottom:0;height:34%;padding:9px 10px 8px;background:#15110d;font:700 14px/1.1 var(--serif);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.cv .ti small{font:400 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.7}.cv.real .art,.cv.real .ti{display:none}
.meta{font-size:12px;color:var(--mu);letter-spacing:.03em}.match{color:var(--ac);font-weight:700}
.tag{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin:0 14px 4px 0}.tag::before{content:"/ "}
.hero{display:flex;gap:32px;flex-wrap:wrap}.hero .cv{width:210px;flex:none}.hero .i{flex:1;min-width:240px}
.ad{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--bd)}
.pl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;color:#fff;white-space:nowrap}
.note{font-size:11px;color:var(--mu);margin-top:28px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lh{padding:44px 0 36px;max-width:780px}.lh h1{font-size:clamp(40px,8vw,82px);line-height:.98;margin:18px 0}.lh h1 span{font-style:italic;color:var(--ac)}.lh .meta{font-family:var(--serif)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 28px;border-top:2px solid var(--tx)}
.st2{padding:14px 0 18px;border-bottom:1px solid var(--bd)}.st2 b{font:400 12px var(--mono);color:var(--ac)}.st2 h3{margin:4px 0}.st2 p{margin:0}
.prof{border:2px solid var(--tx);padding:20px 22px;background:var(--card)}
.deck{position:relative;height:480px;max-width:340px;margin:18px auto 16px}
.sc{position:absolute;inset:0;background:#f4efe4;color:#1a1714;padding:12px 12px 0;box-shadow:0 14px 30px rgba(0,0,0,.3);touch-action:pan-y;user-select:none;display:flex;flex-direction:column;border:1px solid #d8cfba}
.sc:not(.top){transform:scale(.95) translateY(12px);pointer-events:none}.sc.top{cursor:grab}
.sc .art{flex:1;overflow:hidden;border:1px solid #1a1714;pointer-events:none;min-height:0}.sc .art svg{width:100%;height:100%;display:block}
.sc .cap{padding:10px 2px 12px;pointer-events:none}.sc .cap small{font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#7a705f}.sc .cap b{display:block;font:600 24px/1.1 var(--serif)}
.sc .st{position:absolute;top:34px;font:800 24px var(--mono);letter-spacing:.1em;border:3px solid;padding:2px 10px;opacity:0;background:#f4efe499}
.st.y{left:26px;color:#1f7a3d;transform:rotate(-10deg)}.st.n{right:26px;color:#c8321e;transform:rotate(10deg)}
.acts{display:flex;justify-content:center;gap:32px;margin-bottom:10px}.rd{width:62px;height:62px;border-radius:50%;font-size:24px;padding:0;border-width:2px}
.rd.no{color:#c8321e;border-color:#c8321e}.rd.yes{color:#1f7a3d;border-color:#1f7a3d}.rd:hover{background:transparent;transform:scale(1.07)}

let S={w:{},moods:[],picks:[],s:[],done:false,stage:0},view='landing',cur=null,Qd=[],qi=0,busy=0;

function nextCards(){
 if(S.stage==0)return M.map(card);

 return(S.stage==2?G:E).map(card)}
function begin(){S={w:{},moods:[],picks:[],s:[],done:false,stage:0};Qd=nextCards();qi=0;view='quiz';render();scrollTo(0,0)}

 qi++;if(qi>=Qd.length){S.stage++;if(S.stage>3){view='plat';render();return}Qd=nextCards();qi=0}render()}
function fly(y){if(busy||view!='quiz')return;const el=document.querySelector('.sc.top');if(!el)return;busy=1;

function bind(){const el=document.querySelector('.sc.top');if(!el)return;let x0=null,dx=0;
 el.onpointerdown=e=>{x0=e.clientX;el.setPointerCapture(e.pointerId);el.style.transition='none'};
 el.onpointermove=e=>{if(x0==null)return;dx=e.clientX-x0;pose(el,dx)};
 el.onpointerup=el.onpointercancel=()=>{if(x0==null)return;x0=null;if(Math.abs(dx)>90)fly(dx>0?1:0);else{el.style.transition='transform .2s';pose(el,0)}dx=0}}

 const app=document.getElementById('app'),nav=document.getElementById('nav');

 }}
